# Kiremote configuration. Copy to ~/.config/kiremote/kiremote.ini.

[device]
# Name the phone shows for this computer. Default: the host name.
#name = my-computer

# desktop, laptop, phone, tablet or tv (only changes the icon on the phone).
#type = desktop

[network]
# Extra IPv4 addresses that get our discovery packet, besides the broadcast:
# useful when the Wi-Fi blocks broadcasts (or add this computer's address in
# the phone app, under "Add devices by IP").
#addresses = 192.168.0.20

[share]
# Where received files go. Default: your XDG download folder.
#dir = ~/Downloads

[plugins]
# Any plugin can be turned off (the phone is told on the next connection):
# ping, share, battery, connectivity_report, findmyphone, telephony,
# pausemusic, mpris, systemvolume, clipboard, notifications, runcommand,
# mousepad, presenter, lockdevice and screensaver_inhibit (off unless true).
#battery = false
#screensaver_inhibit = true

[find]
# Sound played when the phone looks for this computer, and the player to
# use (paplay, pw-play or aplay are tried in that order). Default: a beep
# pattern made on the spot.
#sound = /usr/share/sounds/freedesktop/stereo/phone-incoming-call.oga
#player = paplay

[pausemusic]
# Pause the media players when a call rings (or only once it is answered).
#only_when_talking = false
#resume = true

[battery]
# Where the computer's battery is read from. Only tests change this.
#power_supply_dir = /sys/class/power_supply

[clipboard]
#auto_share = true        # send what is copied here to the phone
#share_passwords = false  # also what a password manager marks as secret

[runcommand]
# The commands the phone may run: "Name = shell command". The name is also
# the key; only these can be run, never a command line from the phone.
#Lock screen = loginctl lock-session

[lock]
#command = loginctl lock-session
# Unlocking from a phone is off; both lines are needed to turn it on.
#allow_unlock = false
#unlock_command = loginctl unlock-session
