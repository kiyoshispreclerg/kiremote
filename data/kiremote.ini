# Kiremote configuration. Copy to ~/.config/kiremote/kiremote.ini.

[device]
# Name the phone shows for this computer. Default: the host name.
#name = my-computer

# desktop, laptop, phone, tablet or tv (only changes the icon on the phone).
#type = desktop

[network]
# Extra IPv4 addresses that get our discovery packet, besides the broadcast:
# useful when the Wi-Fi blocks broadcasts (or add this computer's address in
# the phone app, under "Add devices by IP").
#addresses = 192.168.0.20

[share]
# Where received files go. Default: your XDG download folder.
#dir = ~/Downloads
